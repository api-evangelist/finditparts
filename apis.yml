apis:
- aid: finditparts:finditparts-reseller-api
  name: FinditParts Reseller API
  description: 'The FinditParts Reseller API allows you to search parts inventory,
    create and integrate FinditParts accounts, quote shipping rates for orders, and
    place orders on behalf of linked FinditParts users. It spans catalog search and
    part-number lookup, variant price/availability, shipping-method quoting, hosted
    USER_SETUP and NEW_ORDER customer sessions, cart and checkout, address book, and
    order history — 38 operations across 31 paths. Authentication is a short-lived
    HS256 JWT signed with a Reseller Client Secret, or an issued API key for client-side
    and single-buyer partner applications.'
