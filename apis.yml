aid: finditparts
name: FinditParts
description: 'FinditParts is a Los Angeles-based online marketplace for heavy-duty
  truck, trailer, fleet and industrial replacement parts, selling OE, aftermarket and
  remanufactured components to owner-operators, fleet parts managers and mechanics
  nationwide. Its developer surface is the FinditParts Reseller API — a partner and
  reseller integration that lets shop-management platforms, e-commerce sites and fleet
  applications search the parts catalog with account-specific pricing, look parts up
  by part number and cross-reference, quote real-time shipping, create and link FinditParts
  customer accounts through hosted embeddable sessions, build carts and place orders
  on a linked customer''s behalf, and read back order status and shipments.'
