- url: https://finditparts.com/api/v1
  description: Production. This is the baseUrl collection variable published in the FinditParts Reseller API Postman collection; FinditParts documents no separate sandbox host.
security:
- resellerJWT: []
- apiKey: []
tags:
- name: Variants
  description: Variant-level price, quantity, cutoff and core lookups.
paths:
  /variants/{variant_ids}:
    get:
      operationId: variantLookup
      summary: Variant Lookup
      tags:
      - Variants
      description: 'Returns the matching variants by ID


        Requires a JWT in the Authorization header with intent ''PRODUCT_SEARCH'' and on behalf of a ''Customer Reference'' (See Workflow section in /reseller_customer_sessions endpoint).


        Use a customer referenced JWT with intent PRODUCT_SEARCH to return account specific pricing or a Generic JWT token (no customer reference) to return list price.


        JWT payload for product search

        Example JWT payload (with customer reference sub to return account_price):


        JWT.sign({

        sub: "CUSTOMER_123",

        iss: "acme-corp-sandbox",

        exp: 1600903066,

        data: {

        intent: "PRODUCT_SEARCH",

        }

        }, ''RESELLER_CLIENT_SECRET'')

        => "JWT.TOKEN.HERE"

        Example generic JWT payload (no customer reference sub to return generic list price of products):


        JWT.sign({

        iss: "acme-corp-sandbox",

        exp: 1600903066,

        }, ''RESELLER_CLIENT_SECRET'')

        => "JWT.TOKEN.HERE"'
      parameters:
      - name: variant_ids
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'Variant Lookup Response: A list of matching variants'
          content:
            application/json:
              schema:
                type: object
                properties:
                  variants:
                    type: array
                    items:
                      type: object
                      properties:
                        variant_id:
                          type: integer
                        price:
                          type: string
                        quantity:
                          type: integer
                        pack_quantity:
                          type: integer
                        minimum:
                          type: integer
                        verified:
                          type: boolean
                        location:
                          type: string
                        timezone:
                          type: string
                        cutoff:
                          type: string
                          format: date-time
                        past_cutoff:
                          type: boolean
                        core_price:
                          type: string
                        estimated_business_days_to_ship:
                          type: integer
                        estimated_ship_date:
                          type: string
                          format: date-time
                        estimated_days_to_deliver:
                          type: integer
                        estimated_delivery_date_ground:
                          type: string
                          format: date-time
                        account_price:
                          type: string
                        minimum_order:
                          type: string
                        minimum_order_fee:
                          type: string
                  errno:
                    type: integer
              example:
                variants:
                - variant_id: <integer>
                  price: <string>
                  quantity: <integer>
                  pack_quantity: <integer>
                  minimum: <integer>
                  verified: <boolean>
                  location: <string>
                  timezone: <string>
                  cutoff: <dateTime>
                  past_cutoff: <boolean>
                  core_price: <string>
                  estimated_business_days_to_ship: <integer>
                  estimated_ship_date: <dateTime>
                  estimated_days_to_deliver: <integer>
                  estimated_delivery_date_ground: <dateTime>
                  account_price: <string>
                  minimum_order: <string>
                  minimum_order_fee: <string>
                - variant_id: <integer>
                  price: <string>
                  quantity: <integer>
                  pack_quantity: <integer>
                  minimum: <integer>
                  verified: <boolean>
                  location: <string>
                  timezone: <string>
                  cutoff: <dateTime>
                  past_cutoff: <boolean>
                  core_price: <string>
                  estimated_business_days_to_ship: <integer>
                  estimated_ship_date: <dateTime>
                  estimated_days_to_deliver: <integer>
                  estimated_delivery_date_ground: <dateTime>
                  account_price: <string>
                  minimum_order: <string>
                  minimum_order_fee: <string>
                errno: <integer>
        '500':
          description: API error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errno:
                    type: integer
                  message:
                    type: string
              example:
                errno: <integer>
                message: <string>
      x-postman-request: https://finditparts.com/api/v1/variants/:variant_ids
components:
  securitySchemes:
    resellerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A short-lived JWT signed with your Reseller Client Secret using HS256. Required claims: iss (your Reseller Client ID) and exp (kept as short as reasonable to prevent replay). Add sub (the Customer Reference) and a data.intent claim (PRODUCT_SEARCH, SHIPPING_METHODS, USER_SETUP, NEW_ORDER) on the endpoints that act on behalf of a specific customer. Presented as: Authorization: Bearer JWT.TOKEN.HERE'
    apiKey:
      type: http
      scheme: bearer
      description: 'An issued FinditParts API key in the form api-XYZ123, for client-side apps that cannot hold a JWT secret (mobile apps, single-buyer partner applications). Grants the non-user-specific surface (product search, create session, create user); user-specific calls require exchanging user credentials for a user-specific JWT via createSession first. Presented as: Authorization: Bearer api-XYZ123'
