            example:
              first_name: <string>
              last_name: <string>
              address1: <string>
              phone: <string>
              city: <string>
              state: <string>
              zipcode: <string>
              country: <string>
              address2: <string>
              company: <string>
              address_type: commercial
      responses:
        '200':
          description: 'Create Address Response: Address'
          content:
