  /products:
    get:
      operationId: productSearch
      summary: Product Search
      tags:
      - Products
      description: |-
        Returns a list of products matching part number provided.

        One of part_number or query parameter is required.

        Requires a JWT in the Authorization header with intent 'PRODUCT_SEARCH' and on behalf of a 'Customer Reference' (See Workflow section in /reseller_customer_sessions endpoint).

        Use a customer referenced JWT with intent PRODUCT_SEARCH to return account specific pricing or a Generic JWT token (no customer reference) to return list price.

        Toggle between v3 and v2 search with use_v3_search=true

        JWT payload for product search
        Example JWT payload (with customer reference sub to return account_price):

        JWT.sign({
          sub: "CUSTOMER_123",
          iss: "acme-corp-sandbox",
          exp: 1600903066,
          data: {
            intent: "PRODUCT_SEARCH",
          }
        }, 'RESELLER_CLIENT_SECRET')
        => "JWT.TOKEN.HERE"
        Example generic JWT payload (no customer reference sub to return generic list price of products):

        JWT.sign({
          iss: "acme-corp-sandbox",
          exp: 1600903066,
        }, 'RESELLER_CLIENT_SECRET')
        => "JWT.TOKEN.HERE"
