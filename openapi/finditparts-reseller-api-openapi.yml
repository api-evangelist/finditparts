        in: query
        required: false
        schema:
          type: string
      - name: country
        in: query
        required: false
        schema:
          type: string
      - name: address_type
        in: query
        required: false
        schema:
          type: string
          examples:
          - commercial
      responses:
        '200':
          description: 'Shipping Methods Response: A list of available shippping methods and cost'
