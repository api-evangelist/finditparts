  /reseller_customer_sessions:
    post:
      operationId: createResellerCustomerSession
      summary: Create Reseller Customer Session
      tags:
      - Reseller Customer Sessions
      description: |-
        Creates a new Reseller Customer Session with intent of USER_SETUP or NEW_ORDER.

        Returns session details including redirect_url for embedding or redirecting.

        Workflow
        Each Reseller Customer Session is generated on behalf of a "Customer Reference". A Customer Reference should be a unique handle to your customer which will then be linked to a FinditParts account. Common identifiers could be a user ID or an email. This is the reference you will use in the future to place orders on behalf of the linked FinditParts user from a USER_SETUP session.

        Each session has an intent of either USER_SETUP or NEW_ORDER.  You must complete a USER_SETUP session for each Customer Reference before performing a NEW_ORDER session.

        Upon creation, a session will return a finditparts.com URL that should be embedded in an iframe on your site or redirected to for the customer to complete USER_SETUP or a NEW_ORDER.

        The USER_SETUP session will prompt the user to create a FinditParts account along with payment details and shipping address or login to an existing FinditParts account. You may re-run a USER_SETUP session on a previously setup Customer Reference to modify payment details or shipping addresses.

        The NEW_ORDER session will prompt the user with an order summary including final cost and confirmation of payment and shipping details.

        JWT Payload for creating Reseller Customer Session

        Each JWT to create a Reseller Customer Session must include the subject header sub which should specify the Customer Reference.
        Each JWT to create a Reseller Customer Session must include a data payload matching one of following formats depending on intent of the session being created:

        USER_SETUP Session
        To link and setup a customer reference you provide to a new or existing FinditParts user, you can create a USER_SETUP session by providing a data payload in the JWT of the following format:

        Example JWT payload:

        JWT.sign({
          sub: "CUSTOMER_123",
          iss: "acme-corp-sandbox",
          exp: 1600903066,
          data: {
            intent: "USER_SETUP",
            user: {
              firstname: '...',
              lastname: '...',
              email: '...',
              company: '...',
              address: {
                address1: '...',
                address2: '...',
                city: 'Los Angeles',
                zipcode: '90000',
                state: 'CA',
                phone: '555-555-5555',
                country: 'USA',
              }, // Address to prefill
            }, // Optional to prefill form
            redirect_url: "https://acmecorp.com/finditparts_setup_success", // Optional to redirect upon completion, otherwise will postMessage
          }
        }, 'RESELLER_CLIENT_SECRET')
        => "JWT.TOKEN.HERE"
        If redirect_url is provided, the following query parameters will be provided upon completion:

        Success will include resolution=SUCCESS&customer_reference=XXX&reseller_customer_session_id=XXX
        Failure will include resolution=FAILED&reason=XXX&customer_reference=XXX&reseller_customer_session_id=XXX

        NEW_ORDER Session
        To place a new order on behalf of a previously setup Customer Reference, you can create a NEW_ORDER session by providing a data payload in the JWT of the following format:

        Example JWT payload:

        JWT.sign({
          sub: "CUSTOMER_123",
          iss: "acme-corp-sandbox",
          exp: 1600903066,
          data: {
            intent: "NEW_ORDER",
            line_items: [
              // Can specify line items by a finditparts_product_id, specific variant_id, or part_number and manufacturer
              {
                finditparts_product_id: "<FinditParts product ID>",
                quantity: <integer>,
              },
              {
                variant_id: "<specific variant ID from Product Search>",
                quantity: <integer>,
              },
              {
                part_number: "<part number>",
                manufacturer: "<name of manufacturer to assist product identification>",
                quantity: <integer>,
              },
              ...
            ],
            default_shipping_address: "123 Main St, Los Angeles, CA, 90000", # Default shipping address to select on the new order. Must match an address already added to the account. Match is performed by numerical address and zipcode.
            default_shipping_method: "29", # Shipping Method identifiers can be found via `/shipping_methods` API call for a given set of `line_items`
            redirect_url: "https://acmecorp.com/finditparts_setup_success", // Optional to redirect upon completion, otherwise will postMessage
          }
        }, 'RESELLER_CLIENT_SECRET')
        => "JWT.TOKEN.HERE"
        If redirect_url is provided, the following query parameters will be provided upon completion:

        Success will include resolution=SUCCESS&customer_reference=XXX&reseller_customer_session_id=XXX
        Failure will include resolution=FAILURE/CANCELLED&customer_reference=XXX&reseller_customer_session_id=XXX

        If no redirect_url is provided (iframe implementation), the following will postMessage to the parent iframe upon completion:

        Error:
        {
          error: true,
          message: String
        }

        Success:
        {
          error: false,
          intent: String,
          resolution: String,
          reseller_customer_session_id: String,
          customer_reference: String,
        }
