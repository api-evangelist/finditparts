components:
  securitySchemes:
    resellerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A short-lived JWT signed with your Reseller Client Secret using HS256. Required claims: iss (your Reseller
        Client ID) and exp (kept as short as reasonable to prevent replay). Add sub (the Customer Reference) and a data.intent
        claim (PRODUCT_SEARCH, SHIPPING_METHODS, USER_SETUP, NEW_ORDER) on the endpoints that act on behalf of a specific
        customer. Presented as: Authorization: Bearer JWT.TOKEN.HERE'
    apiKey:
      type: http
      scheme: bearer
      description: 'An issued FinditParts API key in the form api-XYZ123, for client-side apps that cannot hold a JWT secret
        (mobile apps, single-buyer partner applications). Grants the non-user-specific surface (product search, create session,
        create user); user-specific calls require exchanging user credentials for a user-specific JWT via createSession first.
        Presented as: Authorization: Bearer api-XYZ123'
  schemas:
    ApiError:
      type: object
      description: The single error envelope every FinditParts Reseller API error returns. errno values are enumerated in
        errors/finditparts-error-codes.yml.
      properties:
        errno:
          type: integer
          description: FinditParts error number. 0 = no error.
        message:
          type: string
          description: Human-readable error message.
      required:
      - errno
