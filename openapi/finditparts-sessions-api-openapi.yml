- resellerJWT: []
- apiKey: []
tags:
- name: Sessions
  description: User-specific JWT session creation, refresh, inspection and destruction.
paths:
  /sessions/refresh:
    post:
      operationId: refreshSession
      summary: Refresh Session
      tags:
      - Sessions
      description: 'Returns a new user and user specific JWT token that can be used in the Authentication header to perform API calls on behalf of a user or return user specific pricing.


        User specific session JWTs have a default expiration of 1 month. Re-run this call prior to expiration to continually fetch new sessions as needed.


        Requires an existing and unexpired user specific JWT in the Authorization header.'
