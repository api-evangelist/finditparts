        '200':
          description: 'Refresh Session Response: User specific JWT'
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      firstname:
                        type: string
                      lastname:
                        type: string
                      company:
                        type: string
                      payment_processor_client_token:
                        type: string
                      shipping_address:
                        type: object
