                            type: string
                          address1:
                            type: string
                          state_id:
                            type: integer
                          state_name:
                            type: string
                          city_name:
                            type: string
                          zipcode:
                            type: string
                          phone:
                            type: string
                          address_type:
                            type: string
                            examples:
                            - residential
                          address2:
                            type: string
                          company:
                            type: string
                          is_default:
                            type: boolean
                      billing_address:
                        type: object
                        properties:
                          id:
                            type: integer
                          first_name:
                            type: string
                          last_name:
                            type: string
                          country_id:
                            type: integer
                          country_iso:
                            type: string
                          address1:
                            type: string
                          state_id:
                            type: integer
                          state_name:
                            type: string
                          city_name:
                            type: string
                          zipcode:
                            type: string
                          phone:
                            type: string
                          address_type:
                            type: string
                            examples:
