  /products:
    get:
      operationId: productSearch
      summary: Product Search
      tags:
      - Products
      description: "Returns a list of products matching part number provided.\n\nOne of part_number or query parameter is required.\n\nRequires a JWT in the Authorization header with intent 'PRODUCT_SEARCH' and on behalf of a 'Customer Reference' (See Workflow section in /reseller_customer_sessions endpoint).\n\nUse a customer referenced JWT with intent PRODUCT_SEARCH to return account specific pricing or a Generic JWT token (no customer reference) to return list price.\n\nToggle between v3 and v2 search with use_v3_search=true\n\nJWT payload for product search\nExample JWT payload (with customer reference sub to return account_price):\n\nJWT.sign({\n  sub: \"CUSTOMER_123\",\n  iss: \"acme-corp-sandbox\",\n  exp: 1600903066,\n  data: {\n    intent: \"PRODUCT_SEARCH\",\n  }\n}, 'RESELLER_CLIENT_SECRET')\n=> \"JWT.TOKEN.HERE\"\nExample generic JWT payload (no customer reference sub to return generic list price of products):\n\nJWT.sign({\n  iss: \"acme-corp-sandbox\",\n  exp: 1600903066,\n}, 'RESELLER_CLIENT_SECRET')\n=> \"JWT.TOKEN.HERE\""
      parameters:
      - name: part_number
        in: query
        required: false
        schema:
          type: string
      - name: query
        in: query
        required: false
        schema:
          type: string
      - name: order
        in: query
        required: false
        schema:
          type: string
          examples:
          - manufacturer_to_a
