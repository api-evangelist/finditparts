                            type: integer
                          name:
                            type: string
                          permalink:
                            type: string
                          is_hidden:
                            type: boolean
                      current_variant:
                        type: object
                        properties:
                          variant_id:
                            type: integer
                          price:
                            type: string
                          quantity:
                            type: integer
                          pack_quantity:
