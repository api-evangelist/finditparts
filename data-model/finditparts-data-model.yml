lifecycle_flow:
  reseller_hosted: >-
    createResellerCustomer -> createResellerCustomerSession(USER_SETUP) -> customer
    completes hosted page -> createResellerCustomerSession(NEW_ORDER) -> customer
    confirms -> getResellerCustomerSession returns the Order.
  direct_api: >-
    createSession (or createUser) -> productSearch / variantLookup -> createCart ->
    addCartLineItem -> setCartShippingAddress -> getCartShippingMethods ->
    selectCartShippingMethod -> completeCartWithCreditCard -> getOrder.
observations:
- >-
  partnersPlaceOrder documents a 200 example whose envelope key is shipping_methods,
  not an order or cart. That is almost certainly an error in the provider's published
  collection — the operation is named and described as placing an order. Recorded, not
  corrected; the derived OpenAPI carries the payload as published.
- >-
  Product identity is inconsistent across the surface: the same value appears as id
  (getProduct), finditparts_product_id (productSearch, cart line items, NEW_ORDER
  payloads) and product_id (cart line items). An agent must normalize these.
