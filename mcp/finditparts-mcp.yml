  result: FinditParts publishes no hosted, remote or local MCP server, and no agent-facing tool surface
    of any kind. NOT PUBLISHED BY FINDITPARTS — the tool set below is a candidate derived by API Evangelist
    from the operations of the Reseller API as a proposal for what an MCP surface would look like. Every
    tool binds to a real operationId in openapi/finditparts-reseller-api-openapi.yml, so each one's true
    input schema is that operation's parameters and requestBody.
server: null
