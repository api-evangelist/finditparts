auth:
  note: Any real server would have to carry the reseller credential server-side, not in the agent. FinditParts
    requires a fresh HS256 JWT signed with the Reseller Client Secret per request, with iss, exp and —
    for account pricing and any order action — a sub Customer Reference. An MCP server would sign per
    call and expose the Customer Reference as a tool argument or as session state.
  scheme: bearer (reseller JWT or api- key)
  detail: authentication/finditparts-authentication.yml
safety_notes:
- Six operations place or cancel real commercial orders for heavy-duty parts (completeCartWithCreditCard,
  completeCartWithCorporateBilling, partnersPlaceOrder, createResellerCustomerSession with NEW_ORDER intent,
  cancelResellerCustomerSession, addCartLineItem). agentic-access/finditparts-agentic-access.yml classifies
  these at consequence physical.
- FinditParts publishes NO idempotency key. A retried checkout tool call can duplicate an order. Any MCP
  server built on this API must de-duplicate on its own side.
- errno rides on 200 responses. A tool wrapper that checks HTTP status only will report failures as successes.
