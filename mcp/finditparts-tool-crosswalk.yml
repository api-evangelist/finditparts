gaps_a_real_mcp_server_would_have_to_solve:
- No idempotency key on any write — the server must de-duplicate order placement itself.
- errno on 200 responses — the server must unwrap the envelope, not trust HTTP status.
- No rate limits published — the server has no budget to plan or back off against.
- >-
  Pricing is credential-dependent: the same productSearch returns list price or
  account_price depending on whether the JWT carries a sub Customer Reference. A tool
  must make clear which price it returned.
